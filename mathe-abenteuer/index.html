/* Module navigation and A2 typed-answer practice */
.moduleNav{display:flex;gap:10px;align-items:stretch;margin:0 0 18px;flex-wrap:wrap}
.moduleButton{display:flex;flex-direction:column;gap:3px;flex:1;min-width:160px;background:#fff;border:2px solid #d9e6d9;border-radius:17px;padding:13px 17px;text-align:left;color:#335c44;box-shadow:0 2px 10px #174c280b}
.moduleButton .moduleName{font-size:16px;font-weight:900}.moduleButton small{color:var(--muted);font-size:11px}
.moduleButton.active{border-color:var(--forest);background:#e6f5e9;color:#124b31}
.moduleButton.active small{color:#3d7151}
.moduleButton:focus-visible{outline:3px solid #f5c54c;outline-offset:2px}
.moduleNext{align-self:center;font-size:12px;color:#6b806e;margin-left:auto}
.mathCard{background:linear-gradient(135deg,#f5faf3,#e8f3e8);border:1px solid #dae9da;border-radius:21px;padding:22px 16px;margin-bottom:18px}
.equationLabel{font-size:12px;letter-spacing:.07em;font-weight:800;color:#66806c;margin:0 0 12px;text-align:center;text-transform:uppercase}
.mathEquation{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;min-height:95px}
.mathSource{font-size:clamp(22px,3.4vw,33px);letter-spacing:-.02em;font-weight:950;white-space:nowrap}
.eqSign{font-size:27px;font-weight:900;color:#567f61;margin:0 4px}
.answerInputs{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.mathField{display:flex;align-items:center;gap:5px}
.mathField input{font-family:inherit;width:122px;max-width:34vw;border:2px solid #c4d9c6;border-radius:12px;background:#fff;padding:15px 11px;color:var(--forest-dark);text-align:center;font-weight:900;font-size:24px;min-height:61px}
.mathField input:focus{outline:3px solid #f4cf6c;outline-offset:1px;border-color:#1a784d}
.mathField input:disabled{background:#f3f7f2;color:#55745b;opacity:1}
.mathField input.correctInput{background:#e5f9eb;border-color:#1d9b5d}
.mathField input.wrongInput{background:#fff1ec;border-color:#cd826e}
.mathField .unit{font-size:18px;font-weight:800;color:#41674c}
.unitSteps{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center;margin:0 0 15px}
.unitStep{border:1px solid #d8e5d9;background:#f6faf6;border-radius:9px;padding:8px 10px;font-size:13px;font-weight:850;color:#5b7464}
.unitStep.focusUnit{border-color:#65b586;background:#e0f4e6;color:#195c3d}
.unitArrow{font-size:11px;color:#839787}
.miniMathNote{font-size:12px;color:#67806c;text-align:center;margin:-8px 0 17px}
.numInputNote{font-size:13px;color:#738778;text-align:center;margin-top:12px}
.feedback .correctFormula{margin-top:8px;font-size:18px;font-weight:900;color:var(--forest-dark)}
.answerRow b{font-variant-numeric:tabular-nums}
@media(max-width:560px){.moduleNav{gap:7px}.moduleButton{padding:11px 13px;min-width:145px}.moduleButton .moduleName{font-size:14px}.moduleButton small{font-size:10px}.mathCard{padding:19px 12px}.mathEquation{gap:8px}.mathSource{font-size:24px}.mathField input{width:90px;min-height:59px;font-size:22px;padding:10px 6px}.mathField .unit{font-size:16px}.answerInputs{gap:7px}.unitStep{padding:7px 8px}}

/* A3: accessible large comparison keys and an iPad-friendly equation. */
.compareCard{background:linear-gradient(135deg,#f5faf3,#e8f3e8);border:1px solid #dae9da;border-radius:21px;padding:28px 12px;margin:14px 0 17px}
.compareEquation{display:grid;grid-template-columns:minmax(0,1fr) 68px minmax(0,1fr);gap:10px;align-items:center;text-align:center;min-height:116px}
.compareOperand{font-size:clamp(18px,3vw,28px);font-weight:900;color:#164b33;line-height:1.22;overflow-wrap:break-word;font-variant-numeric:tabular-nums}
.compareUnknown{font-size:42px;font-weight:900;color:#ab7931;background:#fff7dd;border:2px dashed #eed18e;border-radius:14px;min-height:70px;display:grid;place-items:center}
.compareChoices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.compareChoice{background:#fff;border:2px solid #dce7de;border-radius:16px;min-height:105px;padding:9px 6px;text-align:center;color:#194831;font-size:44px;font-weight:950;line-height:1;transition:background .12s,border-color .12s}
.compareChoice small{display:block;font-size:12px;color:#67806c;margin-top:7px;font-weight:750;line-height:1.2}
.compareChoice:not(:disabled):active{transform:scale(.985)}
.compareChoice.selected{background:#e5f6eb;border-color:var(--forest)}
.compareChoice.correct{background:#e2f5e9;border-color:#1b8c57;color:#17663f}
.compareChoice.wrong{background:var(--wrongbg);border-color:#cc775f;color:#923d2b}
@media(max-width:560px){.compareCard{padding:18px 9px}.compareEquation{grid-template-columns:minmax(0,1fr) 46px minmax(0,1fr);gap:5px;min-height:92px}.compareOperand{font-size:clamp(15px,4.6vw,22px)}.compareUnknown{min-height:57px;font-size:34px;border-radius:10px}.compareChoices{gap:7px}.compareChoice{min-height:90px;font-size:37px}.compareChoice small{font-size:10px}}


/* A4: completion of lengths; tactile diagram and equivalent-unit answer entry. */
.complementCard{background:linear-gradient(155deg,#f4faf3,#e5f2e7);border:1px solid #d5e7d9;border-radius:22px;padding:22px 20px;margin:16px 0 18px}
.complementTop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}
.lengthPill{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.05em;color:#4e7156;font-weight:900}
.lengthPill strong{font-size:25px;letter-spacing:0;color:#134c31}
.targetSide{font-size:12px;color:#66806b}
.complementTrack{position:relative;display:flex;width:100%;height:39px;border-radius:12px;border:1px dashed #9ecaae;overflow:hidden;background:repeating-linear-gradient(45deg,#e4f0e2 0,#e4f0e2 9px,#f1f8ef 9px,#f1f8ef 18px)}
.alreadyLength{height:100%;background:linear-gradient(90deg,#369a6b,#16704b);border-radius:10px 0 0 10px}
.complementQuestion{position:absolute;right:12px;top:1px;font-size:24px;font-weight:900;color:#53745f}
.complementInfo{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 20px;color:#4c6957;font-size:12px;font-weight:720;flex-wrap:wrap}
.complementFormula{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;font-size:clamp(19px,3vw,28px);font-weight:900;color:#194a31;text-align:center}
.complementFormula .plus,.complementFormula .equals{color:#6c9075;font-weight:900}
.complementFormula .unknown{display:inline-grid;place-items:center;min-width:55px;min-height:56px;background:#fff8df;border:2px dashed #e2ca87;border-radius:12px;color:#aa7625}
.answerBox{border:1px solid #e0eae0;border-radius:20px;padding:17px 16px;margin-bottom:14px}
.answerBoxTitle{text-align:center;font-size:12px;letter-spacing:.08em;font-weight:900;color:#688371;text-transform:uppercase;margin-bottom:12px}
.complementFields{display:flex;align-items:flex-end;justify-content:center;gap:12px;flex-wrap:wrap}
.complementField{display:flex;flex-direction:column;gap:6px;min-width:0}
.fieldCaption{font-size:12px;color:#688171;font-weight:800}
.lengthField{display:flex;align-items:center;border:2px solid #c6dacb;border-radius:13px;overflow:hidden;background:#fff;min-height:60px}
.lengthField:focus-within{border-color:#157a4f;outline:3px solid #f4cf6c;outline-offset:1px}
.lengthField input{border:0;width:112px;min-width:0;font-family:inherit;font-size:24px;font-weight:900;color:#174b32;padding:13px 10px;text-align:center;outline:0;background:transparent}
.lengthField input.correctInput{background:#e6f6eb}
.lengthField input.wrongInput{background:#fff1ee}
.lengthField select{border:0;border-left:1px solid #e3ebe2;padding:14px 8px;background:#f5faf4;color:#26593b;font-family:inherit;font-size:17px;font-weight:800;min-height:57px;max-width:77px}
.lengthField input:disabled,.lengthField select:disabled{opacity:1;color:#486a52}
.fieldJoin{font-size:25px;color:#77977b;font-weight:900;align-self:center;padding-top:15px}
@media(max-width:560px){.complementCard{padding:18px 12px}.lengthPill strong{font-size:21px}.complementFormula{font-size:20px;gap:5px}.complementFormula .unknown{min-width:40px;min-height:47px}.complementFields{gap:8px}.answerBox{padding:16px 10px}.lengthField input{width:82px;font-size:22px;padding:11px 5px}.lengthField select{padding:12px 4px;font-size:16px;max-width:65px}.fieldJoin{font-size:20px}}

@media(max-width:560px){.complementFields{display:grid;grid-template-columns:1fr;justify-items:center;gap:7px}.complementField{width:178px}.complementField .lengthField input{width:110px}.fieldJoin{padding:0;align-self:center;line-height:1}.complementField .fieldCaption{text-align:left}}

/* B1: interactive analog clock, large drag surface, tap / +/- controls for iPad. */
.b1ClockCard{background:linear-gradient(155deg,#f1f9f0,#e5f1e6);border:1px solid #d5e6d8;border-radius:24px;padding:20px 18px;margin:16px 0 20px;text-align:center;overflow:hidden}
.b1TimeTarget{display:flex;flex-direction:column;align-items:center;gap:5px;color:#46674f}
.b1TimeTarget>span,.b1DigitalHeading,.b1PreviewLabel{font-size:11px;letter-spacing:.09em;font-weight:950;color:#587762}
.b1TimeTarget>strong{color:#154b30;font-size:clamp(24px,3.6vw,38px);font-weight:950;font-variant-numeric:tabular-nums;line-height:1.2}
.b1TimeTarget>small{color:#6c8371;font-size:12px;line-height:1.4}
.b1DialHolder{width:min(100%,300px);aspect-ratio:1/1;margin:8px auto 5px;display:grid;place-items:center}
.b1ClockSVG{display:block;max-width:100%;max-height:100%;filter:drop-shadow(0 9px 12px #204d2a1a)}
.b1ClockSVG.b1Interactive{touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
.b1Editor{background:#ffffffdb;border:1px solid #dbeadf;border-radius:17px;padding:17px 15px;max-width:525px;margin:12px auto 0}
.b1Instruction{display:block;font-size:13px;line-height:1.45;color:#496e55;margin-bottom:14px}
.b1HandSelectors{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.b1HandButton{flex:1;min-width:106px;min-height:55px;border-radius:12px;border:2px solid #d4e5d7;background:#fff;color:#285b3c;font-size:13px;line-height:1.2;font-weight:800;padding:9px 8px}
.b1HandButton.active{background:#e1f5e8;border-color:#1d8353;color:#145333}
.b1HandButton:focus-visible,.b1Adjust button:focus-visible{outline:3px solid #f4c959;outline-offset:1px}
.b1Adjust{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:14px}
.b1Adjust>span{font-size:12px;color:#477154;font-weight:800;min-width:156px}
.b1Adjust button{font-size:29px;font-weight:900;width:58px;min-height:55px;background:#fff;border:2px solid #d0e4d4;border-radius:13px;color:#23623e;line-height:1}
.b1ReadDaypart{font-weight:900;font-size:14px;color:#276040}
.b1DigitalHeading{margin-bottom:14px}
.b1TimeFields{display:flex;gap:9px;align-items:end;justify-content:center;max-width:100%}
.b1TimeField{display:flex;flex-direction:column;gap:8px;flex:0 1 90px;min-width:0;text-align:center}
.b1TimeField span{font-size:12px;font-weight:900;color:#617d69}
.b1TimeField input{min-height:67px;border:2px solid #c4d9c6;border-radius:13px;width:100%;min-width:0;text-align:center;font-size:29px;font-weight:900;font-family:inherit;color:#174b32;background:#fff;font-variant-numeric:tabular-nums}
.b1TimeField input:focus{outline:3px solid #f4cf6c;outline-offset:1px;border-color:#147951}
.b1TimeField input:disabled{opacity:1;color:#345e44;background:#f5f8f4}
.b1TimeField input.correctInput{background:#e4f8eb;border-color:#1e9158}
.b1TimeField input.wrongInput{background:#fff2ee;border-color:#cb8c7b}
.b1Colon{font-size:32px;align-self:end;padding-bottom:17px;color:#648970;font-weight:900}
.b1CorrectPreview{display:flex;align-items:center;flex-direction:column;gap:7px;padding:16px;margin:12px auto;background:#f7fcf6;border:1px solid #cde4d2;border-radius:18px;max-width:420px}

<script>'use strict';
const APP_DATA=JSON.parse(document.getElementById('appData').textContent);
const byId=Object.fromEntries(APP_DATA.sections.map(sec=>[sec.id,sec]));
const app=document.getElementById('app');
const nav=document.getElementById('moduleNav');
const referenceToggle=document.getElementById('referenceToggle');
const anchorBox=document.getElementById('anchorBox');
const STORE='lernziele43_sessions_v2';
const H=val=>String(val).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffled=list=>{const a=list.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
let active='A1';
const sessions={};
function section(){return byId[active];}
function st(){return sessions[active];}
function createSession(){return {mode:'practice',set:'original',items:[],index:0,selected:null,typed:[],unitChoices:[],checked:false,finished:false,hint:false,results:[],clock:null,clockTouched:false,clockHand:'minute',assistOpen:false,assistTotal:null};}
function save(){
  try {
    const modules={};
    for(const [key,s] of Object.entries(sessions)){
      modules[key]={...s,items:s.items.map(q=>q.id)};
    }
    localStorage.setItem(STORE,JSON.stringify({active,modules}));
  }catch(e){/* Works offline even if local storage is unavailable. */}
}
function restore(){
  try {
    const data=JSON.parse(localStorage.getItem(STORE)||'null');
    if(!data || !data.modules || !byId[data.active])return;
    for(const [id,s] of Object.entries(data.modules)){
      if(!byId[id] || !s || !Array.isArray(s.items) || !s.items.length || !Array.isArray(s.results))continue;
      const map=Object.fromEntries(byId[id].questions.map(q=>[q.id,q]));
      if(s.items.some(qid=>!map[qid]) || !Number.isInteger(s.index) || s.index<0 || s.index>=s.items.length)continue;
      if(s.results.length>s.items.length)continue;
      if(!['practice','test'].includes(s.mode) || !['original','supplement','extra','mix'].includes(s.set))continue;
      sessions[id]={...createSession(),...s,items:s.items.map(qid=>map[qid])};
    }
    active=data.active;
  }catch(e){/* Ignore invalid or unavailable saved state. */}
}
function poolFor(id,set){
 const qs=byId[id].questions;
 if(id==='C3'){
  const only=(level)=>qs.filter(q=>q.difficulty===level);
  if(set==='original')return only('easy');
  if(set==='supplement')return shuffled(only('medium')).slice(0,12);
  if(set==='extra')return shuffled(only('hard')).slice(0,12);
  return shuffled(shuffled(only('easy')).slice(0,6).concat(shuffled(only('medium')).slice(0,7),shuffled(only('hard')).slice(0,5)));
 }
 if(set==='original')return qs.filter(q=>q.kind==='original');
 if(id==='A1'){
   if(set==='extra')return shuffled(qs.filter(q=>q.kind==='extra')).slice(0,10);
   return shuffled(qs.filter(q=>q.kind==='original').concat(shuffled(qs.filter(q=>q.kind==='extra')).slice(0,8)));
 }
 if(id==='B1'){
   if(set==='extra')return shuffled(shuffled(qs.filter(q=>q.kind==='extra'&&q.task==='set')).slice(0,6).concat(shuffled(qs.filter(q=>q.kind==='extra'&&q.task==='read')).slice(0,6)));
   if(set==='mix')return shuffled(qs.filter(q=>q.kind==='original').concat(shuffled(qs.filter(q=>q.kind==='extra'&&q.task==='set')).slice(0,5),shuffled(qs.filter(q=>q.kind==='extra'&&q.task==='read')).slice(0,5)));
 }
 if(id==='B2'){
   if(set==='extra')return shuffled(shuffled(qs.filter(q=>q.kind==='extra'&&q.task==='set')).slice(0,6).concat(shuffled(qs.filter(q=>q.kind==='extra'&&q.task==='readPair')).slice(0,6)));
   if(set==='mix')return shuffled(qs.filter(q=>q.kind==='original').concat(shuffled(qs.filter(q=>q.kind==='extra'&&q.task==='set')).slice(0,5),shuffled(qs.filter(q=>q.kind==='extra'&&q.task==='readPair')).slice(0,5)));
 }
 if(set==='supplement')return qs.filter(q=>q.kind==='supplement');
 if(set==='extra')return shuffled(qs.filter(q=>q.kind==='extra')).slice(0,12);
 const original=shuffled(qs.filter(q=>q.kind==='original')).slice(0,8);
 const supplement=shuffled(qs.filter(q=>q.kind==='supplement')).slice(0,5);
 const extra=shuffled(qs.filter(q=>q.kind==='extra')).slice(0,supplement.length?5:10);
 return shuffled(original.concat(supplement,extra));
}
function newRun(){
 const s=st();
 s.items=poolFor(active,s.set);
 s.index=0;s.selected=null;s.typed=[];s.unitChoices=[];s.clock=null;s.clockTouched=false;s.clockHand='minute';s.assistOpen=false;s.assistTotal=null;s.checked=false;s.finished=false;s.hint=false;s.results=[];
 save();render();
}
function closeReference(){anchorBox.hidden=true;referenceToggle.setAttribute('aria-expanded','false');document.getElementById('referenceChevron').textContent='＋';}
function chooseModule(id){
 if(!byId[id] || id===active)return;
 active=id;
 if(!sessions[id]){sessions[id]=createSession();sessions[id].items=poolFor(id,'original');}
 closeReference();save();render();
}
function switchMode(next){
 if(st().mode===next)return;
 st().mode=next;closeReference();newRun();
}
function switchSet(next){
 if(st().set===next)return;
 st().set=next;newRun();
}
function chooseChoice(i){
 if(st().checked||st().finished)return;
 st().selected=i;save();render();
}
function parseWhole(v){
 const cleaned=String(v).replace(/[\s\u00a0'’]/g,'');
 return /^\d+$/.test(cleaned)?Number(cleaned):null;
}
// Convert Swiss/German decimal seconds into integer hundredths without floating-point rounding.
// Both "12,05" and "12.05" are accepted. Maximum two decimal places.
function parseCenti(v){
 const cleaned=String(v).trim().replace(/[\s\u00a0'’]/g,'');
 const match=cleaned.match(/^(\d{1,5})(?:[,.](\d{1,2}))?$/);
 if(!match)return null;
 const result=Number(match[1])*100+Number((match[2]||'').padEnd(2,'0'));
 return Number.isSafeInteger(result)?result:null;
}
function typedComplete(){
 const q=st().items[st().index];
 if(active==='C3')return parseCenti(st().typed[0]??'')!==null;
 if(active==='C2')return q.expectedParts.every((_,i)=>{const n=parseWhole(st().typed[i]??'');return n!==null&&n<(q.task==='missingChain'&&i<4?(i%2===0?24:60):(i%2===0||i===4?24:60));});
 if(active==='C1')return q.steps.every((_,i)=>{const hh=parseWhole(st().typed[i*2]??''),mm=parseWhole(st().typed[i*2+1]??'');return hh!==null&&hh<24&&mm!==null&&mm<60;});
 if(['A2','B3'].includes(active))return q.parts.every((_,i)=>parseWhole(st().typed[i]??'')!==null);
 if(['B1','B2'].includes(active)&&q.task==='set')return Boolean(st().clockTouched);
 if(active==='B1'&&q.task==='read'){
   const count=q.withSeconds?3:2;
   return Array.from({length:count},(_,i)=>parseWhole(st().typed[i]??'')).every((n,i)=>n!==null && n<([24,60,60][i]));
 }
 if(active==='B2'&&q.task==='set')return Boolean(st().clockTouched);
 if(active==='B2'&&q.task==='readPair'){
   const count=q.withSeconds?3:2;
   return Array.from({length:count*2},(_,i)=>parseWhole(st().typed[i]??'')).every((n,i)=>n!==null && n<([24,60,60][i%count]));
 }
 if(active==='A4'){
   const fields=q.suggestedUnits.map((_,i)=>String(st().typed[i]??'').trim());
   return fields.some(v=>v!=='') && fields.every(v=>v===''||parseWhole(v)!==null);
 }
 return false;
}
function formatCenti(cs){return Math.floor(cs/100)+','+String(cs%100).padStart(2,'0');}
function recordTyped(i,val){
 if(!['A2','A4','B1','B2','B3','C1','C2','C3'].includes(active) || st().checked || st().finished)return;
 st().typed[i]=val;
 const submit=app.querySelector('[data-action="submit"]');
 if(submit)submit.disabled=!typedComplete();
 save();
}
function setUnit(i,unit){
 if(active!=='A4'||st().checked||st().finished||!['km','m','dm','cm','mm'].includes(unit))return;
 st().unitChoices[i]=unit;save();
}
function submitAnswer(){
 const s=st();if(s.finished||s.checked)return;
 const q=s.items[s.index];
 let entry;
 if(active==='A1' || active==='A3'){
   if(s.selected===null)return;
   const chosen=q.options[s.selected];
   entry={id:q.id,chosen,correct:chosen===q.answer};
 }else if(active==='A2'){
   if(!typedComplete())return;
   const entries=q.parts.map((p,i)=>parseWhole(s.typed[i]));
   entry={id:q.id,chosen:entries.map((n,i)=>`${n} ${q.parts[i].unit}`).join(' '),
          correct:entries.every((n,i)=>n===q.parts[i].n),entered:entries};
 }else if(active==='C3'){
   if(!typedComplete())return;
   const cs=parseCenti(s.typed[0]);
   entry={id:q.id,chosen:formatCenti(cs)+' s',correct:cs===q.answerCs,entered:[cs]};
 }else if(active==='C2'){
   if(!typedComplete())return;
   const entered=q.expectedParts.map((_,i)=>parseWhole(s.typed[i]));
   const good=entered.every((n,i)=>n===q.expectedParts[i]);
   const chosen=q.task==='missingChain'?`${two(entered[0])}:${two(entered[1])} · ${two(entered[2])}:${two(entered[3])} · ${entered[4]} h ${entered[5]} min`:`${entered[0]} h ${entered[1]} min`;
   entry={id:q.id,chosen,correct:good,entered};
 }else if(active==='C1'){
   if(!typedComplete())return;
   const vals=q.steps.map((step,i)=>{const hh=parseWhole(s.typed[2*i]);const mm=parseWhole(s.typed[2*i+1]);return {h:hh,m:mm,time:two(hh)+':'+two(mm)};});
   entry={id:q.id,chosen:vals.map(x=>x.time).join(' → '),correct:vals.every((x,i)=>x.time===q.steps[i].result),entered:vals.map(x=>x.time)};
 }else if(active==='B3'){
   if(!typedComplete())return;
   const entries=q.parts.map((p,i)=>parseWhole(s.typed[i]));
   entry={id:q.id,chosen:entries.map((n,i)=>`${n} ${q.parts[i].unit}`).join(' '),
          correct:entries.every((n,i)=>n===q.parts[i].n),entered:entries};
 }else if(active==='B1'){
   if(!typedComplete())return;
   if(q.task==='set'){

   }else{

   }
 }else if(active==='B2'){

     entry={id:q.id,chosen:`${two(c.h%12||12)}:${two(c.m)}${q.withSeconds?':'+two(c.sec):''} (Zeigerstellung)`,correct:good};
   }else{
     const vals=s.typed.map(v=>parseWhole(v)),width=q.withSeconds?3:2;

     const secOK=arr=>!q.withSeconds||Math.abs(arr[2]-q.s)<= (q.originalSecondTolerance||0);

   }
 }else if(active==='A4'){
   if(!typedComplete())return;

   const got=entries.reduce((acc,n,i)=>acc+n*size[units[i]],0);

 }

}

// B1 – SVG clock works offline and accepts both taps and drags on touchscreens.
const two=n=>String(n).padStart(2,'0');
const clock0=()=>({h:12,m:0,sec:0});
function clockHands(c){
 return {hour:((c.h%12)+(c.m/60)+(c.sec/3600))*30,minute:(c.m+c.sec/60)*6,second:c.sec*6};
}
function dialSVG(c,withSeconds,interactive){
 const ticks=Array.from({length:60},(_,i)=>{const a=(i*6-90)*Math.PI/180;const big=i%5===0;const r1=big?118:124;const r2=131;
  return `<line x1="${(150+r1*Math.cos(a)).toFixed(2)}" y1="${(150+r1*Math.sin(a)).toFixed(2)}" x2="${(150+r2*Math.cos(a)).toFixed(2)}" y2="${(150+r2*Math.sin(a)).toFixed(2)}" stroke="${big?'#37604a':'#94a99b'}" stroke-width="${big?3.1:1.4}" stroke-linecap="round"/>`;}).join('');
 const numbers=Array.from({length:12},(_,i)=>{const num=i+1,a=(num*30-90)*Math.PI/180;return `<text x="${(150+97*Math.cos(a)).toFixed(2)}" y="${(150+97*Math.sin(a)+7).toFixed(2)}" text-anchor="middle" font-size="23" font-weight="850" fill="#245038">${num}</text>`;}).join('');
 const rot=clockHands(c);
 return `<svg class="b1ClockSVG ${interactive?'b1Interactive':''}" viewBox="0 0 300 300" role="img" aria-label="Analoge Uhr mit Stundenzeiger, Minutenzeiger${withSeconds?' und Sekundenzeiger':''}" ${interactive?'data-clock-dial="1"':''} xmlns="http://www.w3.org/2000/svg"><circle cx="150" cy="150" r="142" fill="#fdfefc" stroke="#3d654e" stroke-width="6"/><circle cx="150" cy="150" r="135" fill="none" stroke="#d8e9dd" stroke-width="3"/>${ticks}${numbers}<g data-hand-shape="hour" transform="rotate(${rot.hour} 150 150)"><line x1="150" y1="164" x2="150" y2="94" stroke="#193f2d" stroke-width="10" stroke-linecap="round"/></g><g data-hand-shape="minute" transform="rotate(${rot.minute} 150 150)"><line x1="150" y1="164" x2="150" y2="52" stroke="#2d7763" stroke-width="7" stroke-linecap="round"/></g>${withSeconds?`<g data-hand-shape="second" transform="rotate(${rot.second} 150 150)"><line x1="150" y1="177" x2="150" y2="35" stroke="#d9584b" stroke-width="3.5" stroke-linecap="round"/></g>`:''}<circle cx="150" cy="150" r="9" fill="#245038"/><circle cx="150" cy="150" r="3.5" fill="#fff"/></svg>`;
}
function updateClockDOM(){
 const el=app.querySelector('[data-clock-dial]');if(!el)return;
 const rot=clockHands(st().clock||clock0());
 for(const [k,a] of Object.entries(rot)){const hand=el.querySelector(`[data-hand-shape="${k}"]`);if(hand)hand.setAttribute('transform',`rotate(${a} 150 150)`);}
 const submit=app.querySelector('[data-action="submit"]');if(submit)submit.disabled=!typedComplete();
}
function chooseClockHand(hand){
 const q=st().items[st().index];if(!['B1','B2'].includes(active)||q.task!=='set'||st().checked||st().finished)return;
 if(!['hour','minute','second'].includes(hand)||hand==='second'&&!q.withSeconds)return;
 st().clockHand=hand;save();render();
}
function stepClock(amount){
 const q=st().items[st().index];if(!['B1','B2'].includes(active)||q.task!=='set'||st().checked||st().finished||![1,-1].includes(amount))return;
 const s=st(),c=s.clock||clock0();
 if(s.clockHand==='hour')c.h=(c.h+amount+12)%12;
 else if(s.clockHand==='minute')c.m=(c.m+amount+60)%60;
 else if(q.withSeconds&&s.clockHand==='second')c.sec=(c.sec+amount+60)%60;
 s.clock=c;s.clockTouched=true;save();render();
}
function bindB1Dial(){
 const svg=app.querySelector('[data-clock-dial]');if(!svg)return;
 const q=st().items[st().index];
 if(q.task!=='set'||st().checked||st().finished)return;
 function moveTo(evt){
   const s=st(),c=s.clock||clock0(),rect=svg.getBoundingClientRect();
   const x=(evt.clientX-rect.left)*300/rect.width-150,y=(evt.clientY-rect.top)*300/rect.height-150;
   if(Math.hypot(x,y)<18)return;
   const ring=(Math.atan2(x,-y)*30/Math.PI+60)%60;
   if(s.clockHand==='hour')c.h=Math.round(ring/5)%12;
   else if(s.clockHand==='minute')c.m=Math.round(ring)%60;
   else if(s.clockHand==='second'&&q.withSeconds)c.sec=Math.round(ring)%60;
   s.clock=c;s.clockTouched=true;updateClockDOM();
 }
 svg.addEventListener('pointerdown',e=>{
   if(e.button!==0)return;e.preventDefault();svg.setPointerCapture(e.pointerId);moveTo(e);save();
 });
 svg.addEventListener('pointermove',e=>{if(svg.hasPointerCapture(e.pointerId)){e.preventDefault();moveTo(e);}});
 svg.addEventListener('pointerup',e=>{if(svg.hasPointerCapture(e.pointerId))svg.releasePointerCapture(e.pointerId);save();});
 svg.addEventListener('pointercancel',e=>{if(svg.hasPointerCapture(e.pointerId))svg.releasePointerCapture(e.pointerId);save();});
}
function renderB1(q){
 const s=st(),done=s.mode==='practice'&&s.checked;
 if(q.task==='set'){
   const hand=s.clockHand||'minute';const names={hour:'Stundenzeiger',minute:'Minutenzeiger',second:'Sekundenzeiger'};
   const hands=[['hour','Kurz · Stunde'],['minute','Lang · Minute'],...(q.withSeconds?[['second','Rot · Sekunde']]:[])];
   const handButtons=hands.map(([key,label])=>`<button type="button" data-hand="${key}" class="b1HandButton ${hand===key?'active':''}" ${done?'disabled':''} aria-pressed="${hand===key}">${label}</button>`).join('');
   const correctPreview=done?`<div class="b1CorrectPreview"><div class="b1PreviewLabel">Richtige Zeigerstellung</div>${dialSVG({h:q.h,m:q.m,sec:q.s},q.withSeconds,false)}<div class="b1DigitalCorrect">${H(q.answer)}</div></div>`:'';
   return `${progressMeta(q)}<h2 class="taskHeading">Zeichne die Zeiger in die Uhr.</h2><p class="taskHint">Stelle die Uhr auf <strong>${H(q.display)}</strong>.</p><div class="b1ClockCard"><div class="b1TimeTarget"><span>🕒 DIE GESUCHTE UHRZEIT</span><strong>${H(q.display)}</strong>${q.sourcePairs.length?'<small>Die beiden Zeiten sehen auf einer Uhr mit 12 Zahlen gleich aus.</small>':''}</div><div class="b1DialHolder">${dialSVG(s.clock||clock0(),q.withSeconds,true)}</div><div class="b1Editor"><span class="b1Instruction">Wähle einen Zeiger und <b>tippe oder ziehe auf dem Zifferblatt</b>.</span><div class="b1HandSelectors">${handButtons}</div><div class="b1Adjust"><button type="button" data-clock-step="-1" aria-label="${names[hand]} einen Schritt zurück" ${done?'disabled':''}>−</button><span>${names[hand]} fein einstellen</span><button type="button" data-clock-step="1" aria-label="${names[hand]} einen Schritt vor" ${done?'disabled':''}>＋</button></div></div></div>${hintFor(q)}${feedbackFor(q)}${correctPreview}${actions()}`;
 }
 const count=q.withSeconds?3:2;
 const inputs=Array.from({length:count},(_,i)=>{
    const names=['Stunden','Minuten','Sekunden'];const max=[23,59,59][i];let cls='';
    if(done){const n=parseWhole(s.typed[i]);cls=n===[q.h,q.m,q.s][i]?'correctInput':'wrongInput';}
    return `<label class="b1TimeField"><span>${names[i]}</span><input class="${cls}" data-field="${i}" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" aria-label="${names[i]} (0 bis ${max})" value="${H(s.typed[i]??'')}" placeholder="${['hh','mm','ss'][i]}" autocomplete="off" ${done?'disabled':''}></label>`;
 }).join('<div class="b1Colon">:</div>');
 return `${progressMeta(q)}<h2 class="taskHeading">Lies die Zeigeruhr.</h2><p class="taskHint">Wie spät ist es <strong>${H(q.daypart)}</strong>? Gib die Uhrzeit digital (0–23 Uhr) ein.</p><div class="b1ClockCard"><div class="b1ReadDaypart">☀️ ${H(q.daypart)} · 24-Stunden-Schreibweise</div><div class="b1DialHolder">${dialSVG({h:q.h,m:q.m,sec:q.s},q.withSeconds,false)}</div><div class="b1Editor"><div class="b1DigitalHeading">Schreibe die Uhrzeit auf</div><div class="b1TimeFields">${inputs}</div></div></div>${hintFor(q)}${feedbackFor(q)}${actions()}`;
}
// B2 – exact original worksheet: read each pictured dial and enter BOTH 24-hour forms.
// Other questions ask to set a clock, reusing the B1 touch-friendly dial.
function renderB2(q){
  if(q.task==='set')return renderB1(q);
  const s=st(),done=s.mode==='practice'&&s.checked;
  const columns=q.withSeconds?3:2;
  const labels=['Stunden','Minuten','Sekunden'];
  const rows=Array.from({length:2},(_,r)=>{
    const inputs=Array.from({length:columns},(_,i)=>{
      const index=r*columns+i,n=parseWhole(s.typed[index]??'');
      const target=i===0?(r?((q.h+12)%24):q.h):i===1?q.m:q.s;
      const matches= i===0 ? [q.h,(q.h+12)%24].includes(n) : i===2?Math.abs(n-target)<=(q.originalSecondTolerance||0):n===target;
      const klass=done?(matches?'correctInput':'wrongInput'):'';
      return `<label class="b1TimeField"><span>${labels[i]}</span><input class="${klass}" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" data-field="${index}" aria-label="${r+1}. Uhrzeit, ${labels[i]}" value="${H(s.typed[index]??'')}" placeholder="${['hh','mm','ss'][i]}" autocomplete="off" ${done?'disabled':''}></label>`;
    }).join('<div class="b1Colon">:</div>');
    return `<div class="b2DigitalRow"><div class="b2RowLabel">${r+1}. mögliche Zeit</div><div class="b1TimeFields">${inputs}</div></div>`;
  }).join('');
  return `${progressMeta(q)}<h2 class="taskHeading">Lies die Uhr und schreibe beide Zeiten auf.</h2><p class="taskHint">Eine Uhr mit 12 Zahlen kann zwei Uhrzeiten im Tagesverlauf zeigen. Schreibe beide als <b>00–23 Uhr</b> auf – die Reihenfolge ist egal.</p><div class="b1ClockCard b2ClockCard"><div class="b1ReadDaypart">🕒 Eine Zeigerstellung · zwei Uhrzeiten</div><div class="b1DialHolder">${dialSVG({h:q.h,m:q.m,sec:q.s},q.withSeconds,false)}</div><div class="b1Editor"><div class="b1DigitalHeading">Beide digitalen Uhrzeiten</div><div class="b2Rows">${rows}</div></div></div>${hintFor(q)}${feedbackFor(q)}${actions()}`;
}

// B3 – exact time-unit conversions, using ×24 and ×60 rather than the length ladder's ×10.
function renderB3(q){
 const s=st(),done=s.mode==='practice'&&s.checked;
 const result=s.results[s.results.length-1];
 const names={d:'Tage',h:'Stunden',min:'Minuten',s:'Sekunden'};
 const rules=s.mode==='practice'?`<div class="timeRules" aria-label="Zeiteinheiten Merkhilfe"><div><strong>1 d</strong><span>24 h</span></div><b>·</b><div><strong>1 h</strong><span>60 min</span></div><b>·</b><div><strong>1 min</strong><span>60 s</span></div></div>`:'';
 const fields=q.parts.map((p,i)=>{
  const entered=parseWhole(s.typed[i]??'');
  const cls=done?(result.entered[i]===p.n?'correctInput':'wrongInput'):'';
  return `<label class="mathField timeMathField"><span class="timeFieldCaption">${names[p.unit]}</span><span class="timeFieldInput"><input class="${cls}" type="text" inputmode="numeric" pattern="[0-9 ]*" enterkeyhint="done" data-field="${i}" aria-label="Zahl in ${names[p.unit]}" placeholder="?" autocomplete="off" autocorrect="off" spellcheck="false" value="${H(s.typed[i]??'')}" ${done?'disabled':''}><span class="unit">${H(p.unit)}</span></span></label>`;
 }).join('');
 return `${progressMeta(q)}<h2 class="taskHeading">Rechne in die angegebene Zeiteinheit um.</h2><div class="taskHint">Trage die Zahlen ein. Denke daran: Ein Tag hat 24 Stunden, eine Stunde 60 Minuten.</div>${rules}<div class="mathCard timeMathCard"><div class="equationLabel">Zeit umrechnen</div><div class="mathEquation"><span class="mathSource">${H(q.source)}</span><span class="eqSign">=</span><div class="answerInputs timeAnswerInputs">${fields}</div></div></div><p class="numInputNote">${q.parts.length===2?'Zwei Felder: Gib zuerst die grössere Einheit, dann den Rest ein. Auch 0 ist möglich.':'Schreibe nur die Zahl in das Feld.'}</p>${hintFor(q)}${feedbackFor(q)}${actions()}`;
}

// C1 – advance a clock by a duration; multiple steps model the printed digital time chain.
function timePretty(total){let x=((total%1440)+1440)%1440;return two(Math.floor(x/60))+':'+two(x%60);}
function renderC1(q){
 const s=st(),done=s.mode==='practice'&&s.checked;
 const res=s.results[s.results.length-1];
 const steps=q.steps.map((step,i)=>{
  const hh=parseWhole(s.typed[2*i]??''),mm=parseWhole(s.typed[2*i+1]??'');
  const obtained=(hh!==null&&mm!==null)?two(hh)+':'+two(mm):'';
  const good=obtained===step.result;
  const cls=done?(good?'correctInput':'wrongInput'):'';
  const result=done?`<small class="c1ResultNote">${good?'✓ Richtig':'→ '+H(step.result)}${step.dayOffset?' · nächster Tag':''}</small>`:'';
  return `<div class="c1Step"><div class="c1StepArrow"><span>＋ ${H(step.duration)}</span><b>↓</b></div><div class="c1StepCard"><div class="c1StepLabel">${q.steps.length>1?`Station ${i+1}`:'Uhrzeit danach'}</div><div class="c1HourFields"><label><span>Stunden</span><input class="${cls}" data-field="${2*i}" inputmode="numeric" type="text" maxlength="2" placeholder="hh" value="${H(s.typed[2*i]??'')}" aria-label="Schritt ${i+1}, Stunden (0 bis 23)" autocomplete="off" ${done?'disabled':''}></label><b>:</b><label><span>Minuten</span><input class="${cls}" data-field="${2*i+1}" inputmode="numeric" type="text" maxlength="2" placeholder="mm" value="${H(s.typed[2*i+1]??'')}" aria-label="Schritt ${i+1}, Minuten (0 bis 59)" autocomplete="off" ${done?'disabled':''}></label></div>${result}</div></div>`;
 }).join('');
 const aid=s.mode==='practice'&&!done?`<section class="c1Aid"><button class="c1AidToggle" type="button" data-assist-toggle="1" aria-expanded="${Boolean(s.assistOpen)}">🕰️ Uhr zum Mitrechnen ${s.assistOpen?'−':'＋'}</button>${s.assistOpen?(()=>{const t=s.assistTotal??q.startMinute; const mod=((t%1440)+1440)%1440;return `<div class="c1AidBody"><div class="c1AidClock">${dialSVG({h:Math.floor(mod/60),m:mod%60,sec:0},false,false)}<strong>${timePretty(t)} ${Math.floor(t/1440)>0?'<small>nächster Tag</small>':''}</strong></div><p>Tippe, um die Uhr weiterzudrehen. Nutze die Rechnung als Hilfe.</p><div class="c1AidButtons">${[[60,'+1 h'],[10,'+10 min'],[5,'+5 min'],[1,'+1 min'],[-5,'−5 min']].map(([delta,label])=>`<button type="button" data-assist-step="${delta}">${label}</button>`).join('')}<button type="button" class="c1Reset" data-assist-reset="1">↺ Startzeit</button></div></div>`})():''}</section>`:'';
 const source=q.adaptation?`<p class="c1Adaptation">ℹ️ ${H(q.adaptation)}</p>`:'';
 return `${progressMeta(q)}<h2 class="taskHeading">Wie spät ist es danach?</h2><p class="taskHint">Starte bei <strong>${H(q.start)}</strong> und rechne die Zeitdauer dazu. Schreibe nach jedem Schritt die <b>digitale Uhrzeit</b> (00–23 Uhr).</p>${source}<div class="c1Canvas"><div class="c1Start"><div class="c1StartDial">${dialSVG({h:Math.floor(q.startMinute/60),m:q.startMinute%60,sec:0},false,false)}</div><div class="c1StartInfo"><span>STARTZEIT</span><strong>${H(q.start)}</strong></div></div><div class="c1Timeline">${steps}</div></div>${aid}${hintFor(q)}${feedbackFor(q)}${actions()}`;
}
function toggleC1Assist(){if(active!=='C1'||st().mode!=='practice'||st().checked)return;st().assistOpen=!st().assistOpen;save();render();}
function moveC1Assist(delta){if(active!=='C1'||st().mode!=='practice'||st().checked)return;const s=st(),q=s.items[s.index];s.assistTotal=Math.max(q.startMinute,(s.assistTotal??q.startMinute)+delta);save();render();}
function resetC1Assist(){if(active!=='C1'||st().mode!=='practice'||st().checked)return;st().assistTotal=st().items[st().index].startMinute;save();render();}

// C2 – elapsed times, plus the precise incomplete timeline from page 7 task 2b.
function renderC2(q){
 const s=st(),done=s.mode==='practice'&&s.checked;
 const result=s.results[s.results.length-1];
 const fields=(i,label,unit,limit)=>{
  const entered=parseWhole(s.typed[i]??'');
  const good=entered===q.expectedParts[i];
  const cls=done?(good?'correctInput':'wrongInput'):'';
  return `<label class="c2Field"><span>${H(label)}</span><input type="text" inputmode="numeric" maxlength="2" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="?" class="${cls}" data-field="${i}" value="${H(s.typed[i]??'')}" aria-label="${H(label)}" ${done?'disabled':''}><small>${H(unit)}</small></label>`;
 };
 const entry= (hourIndex,minuteIndex,hLabel='Stunden',mLabel='Minuten')=>`<div class="c2Entry">${fields(hourIndex,hLabel,'h',24)}${fields(minuteIndex,mLabel,'min',60)}</div>`;
 const day=q.nextDay?`<span class="c2DayPill">🌙 Am nächsten Tag</span>`:'';
 let core='';
 if(q.task==='missingChain'){
  core=`<h2 class="taskHeading">Fülle die Lücken in der Zeitkette.</h2><div class="taskHint">Rechne zweimal rückwärts und ermittle dann die fehlende Dauer.</div>
  <div class="c2Timeline c2FullTimeline">
   <div class="c2Block"><span class="c2Muted">Erste Uhrzeit</span>${entry(0,1,'Stunden','Minuten')}</div>
   <div class="c2Bridge"><span>＋ 42 min</span><b>↓</b></div>
   <div class="c2Block fixed"><span class="c2Muted">Zweite Uhrzeit</span><strong>13:19</strong></div>
   <div class="c2Bridge"><span>Wie lange?</span><b>↓</b></div>
   <div class="c2Block"><span class="c2Muted">Dritte Uhrzeit</span>${entry(2,3,'Stunden','Minuten')}</div>
   <div class="c2Bridge"><span>＋ 1 h 25 min</span><b>↓</b></div>
   <div class="c2Block fixed"><span class="c2Muted">Letzte Uhrzeit</span><strong>19:19</strong></div>
  </div>
  <div class="c2MissingDuration"><span>Wie lange dauert es von <b>13:19</b> bis zur dritten Uhrzeit?</span>${entry(4,5)}</div>
  <p class="c2OriginNote">Originalaufgabe aus dem Zusatzblatt (S. 7, Aufgabe 2b).</p>`;
 }else{
  core=`<h2 class="taskHeading">Wie lange dauert es?</h2>${q.context?`<div class="c2Context">${H(q.context)}</div>`:'<div class="taskHint">Berechne die vergangene Zeit. Gib Stunden und Minuten an.</div>'}
  <div class="c2Timeline">
   <div class="c2Block fixed"><span class="c2Muted">Start</span><strong>${H(q.start)}</strong></div>
   <div class="c2Bridge"><span>Wie viel Zeit?</span><b>↓</b></div>
   <div class="c2Block fixed"><span class="c2Muted">Ende</span><strong>${H(q.end)}</strong>${day}</div>
  </div>
  <div class="c2MissingDuration"><span>Vergangene Zeit</span>${entry(0,1)}</div>
  ${q.kind==='supplement'?'<p class="c2OriginNote">Für C2 umformuliert: Die Uhrzeiten stammen aus der Zeitkette auf dem Zusatzblatt, Aufgabe 2a.</p>':''}`;
 }
 const check=done?`<div class="c2ItemFeedback">${result.correct?'✓ Gut gemacht!':`Richtige Antwort: ${H(q.answer)}`}</div>`:'';
 const proof=s.mode==='practice'?`<div class="c2Proof">🧮 <b>Kontrolle:</b> Anfang + Dauer = Ende.${q.task==='missingChain'?' Arbeite mit der letzten Uhrzeit auch rückwärts.':''}</div>`:'';
 return `${progressMeta(q)}<section class="c2Canvas">${core}</section>${proof}${hintFor(q)}${check}${feedbackFor(q)}${actions()}`;
}

// C3 – story problems with hundredths of a second (all new, based on overview Lernziel).
function renderC3(q){
 const s=st(),done=s.mode==='practice'&&s.checked;
 const result=s.results[s.results.length-1];
 const entered=parseCenti(s.typed[0]??'');
 const cls=done?(entered===q.answerCs?'correctInput':'wrongInput'):'';
 const chips=q.displays.map(item=>`<div class="c3Readout"><span class="c3WatchLabel">${H(item.label)}</span><strong>${H(item.value)}</strong></div>`).join('');
 const tip=s.mode==='practice'?`<p class="c3HelpCaption">💡 Merke: <b>0,01 s</b> = ein Hundertstel einer Sekunde.</p>`:'';
 const resultLine=done?`<div class="c3Result">${result.correct?'✓ Genau richtig!':`Richtige Antwort: ${H(q.answer)}`}</div>`:'';
 const level={easy:'Einstieg',medium:'Training',hard:'Knifflig'}[q.difficulty];
 return `${progressMeta(q)}<section class="c3Canvas">
   <div class="c3TaskTag">🏁 ${H(level)} · Textaufgabe</div>
   <h2 class="c3Story">${H(q.prompt)}</h2>
   <div class="c3Watches" aria-label="Stoppuhrwerte">${chips}</div>
   <div class="c3AnswerBox"><label for="c3Answer">Deine Antwort in Sekunden</label>
     <div class="c3InputRow"><input id="c3Answer" class="${cls}" type="text" inputmode="decimal" maxlength="9" data-field="0" autocomplete="off" spellcheck="false" placeholder="z. B. 0,35" value="${H(s.typed[0]??'')}" ${done?'disabled':''}><span>s</span></div>
     <small>Du kannst ein Komma oder einen Punkt verwenden, z. B. 1,05.</small></div>
   </section>${tip}${hintFor(q)}${resultLine}${feedbackFor(q)}${actions()}`;
}
function renderSummary(){
 const s=st(),total=s.results.length,correct=s.results.filter(r=>r.correct).length;
 const rows=s.items.map((q,i)=>{
  const r=s.results[i];if(!r)return '';
  const heading=active==='B2'?(q.task==='set'?`Stelle die Uhr: ${q.display}`:'Lies die Uhr: zwei Digitalzeiten'):active==='B1'?(q.task==='set'?`Stelle die Uhr: ${q.display}`:`Lies die Uhr ${q.daypart}`):active==='C3'?q.prompt:active==='C2'?(q.task==='missingChain'?'Zeitkette mit Lücken':`${q.start} → ${q.end}${q.nextDay?' (nächster Tag)':''}`):active==='C1'?`${q.start} + ${q.steps.map(x=>x.duration).join(' → ')}`:active==='A1'?`${q.object} · ${q.measurement}`:['A2','B3'].includes(active)?`${q.source} → ${q.targets.join(' / ')}`:active==='A4'?`${q.given} + ? = ${q.target}`:`${q.left} ? ${q.right}`;
  return `<div class="reviewRow ${r.correct?'':'missed'}"><strong>${r.correct?'✅':'🔎'} ${H(heading)}</strong><div class="answerRow"><span>Deine Antwort: <b>${H(r.chosen)}</b></span>${!r.correct?`<span>Richtig: <b>${H(q.answer)}</b></span>`:''}</div>${!r.correct?`<p>${H(q.explanation)}</p>`:''}</div>`;
 }).join('');
 return `${renderControls()}<div class="summary"><div class="summaryIcon">${correct===total?'🏆':correct/total>=.7?'🌟':'🌱'}</div><h2>${correct===total?'Ausgezeichnet!':correct/total>=.7?'Gut gemacht!':'Weiter so!'}</h2><div class="summaryScore">${correct} / ${total}</div><p>${correct===total?'Alle Aufgaben richtig gelöst.':`Du hast ${correct} von ${total} Aufgaben richtig. Mit Üben wirst du noch sicherer!`}</p><button type="button" class="actionPrimary" data-action="restart">Noch eine Runde üben ↻</button><div class="reviewList">${rows}</div></div>`;
}
function render(){
 renderModuleNav();refreshSidebars();
 const s=st(),q=s.items[s.index];
 app.innerHTML=s.finished?renderSummary():`${renderControls()}${active==='A1'?renderA1(q):active==='A2'?renderA2(q):active==='C1'?renderC1(q):active==='C2'?renderC2(q):active==='C3'?renderC3(q):active==='B3'?renderB3(q):active==='A3'?renderA3(q):active==='A4'?renderA4(q):active==='B2'?renderB2(q):renderB1(q)}`;
 app.querySelectorAll('[data-mode]').forEach(el=>el.addEventListener('click',()=>switchMode(el.dataset.mode)));
 app.querySelectorAll('[data-set]').forEach(el=>el.addEventListener('click',()=>switchSet(el.dataset.set)));
 app.querySelectorAll('[data-answer]').forEach(el=>el.addEventListener('click',()=>chooseChoice(Number(el.dataset.answer))));
 app.querySelectorAll('[data-field]').forEach(el=>{
   el.addEventListener('input',()=>recordTyped(Number(el.dataset.field),el.value));
   el.addEventListener('keydown',evt=>{if(evt.key==='Enter'&&typedComplete())submitAnswer();});
 });
 app.querySelectorAll('[data-assist-toggle]').forEach(el=>el.addEventListener('click',toggleC1Assist));
 app.querySelectorAll('[data-assist-step]').forEach(el=>el.addEventListener('click',()=>moveC1Assist(Number(el.dataset.assistStep))));
 app.querySelectorAll('[data-assist-reset]').forEach(el=>el.addEventListener('click',resetC1Assist));
 app.querySelectorAll('[data-hand]').forEach(el=>el.addEventListener('click',()=>chooseClockHand(el.dataset.hand)));
 app.querySelectorAll('[data-clock-step]').forEach(el=>el.addEventListener('click',()=>stepClock(Number(el.dataset.clockStep))));
 bindB1Dial();
 app.querySelectorAll('[data-unit]').forEach(el=>el.addEventListener('change',()=>setUnit(Number(el.dataset.unit),el.value)));
 app.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>{
   switch(el.dataset.action){case 'hint':setHint();break;case 'submit':submitAnswer();break;case 'next':next();break;case 'restart':newRun();break;}
 }));
}
referenceToggle.addEventListener('click',()=>{
 if(st().mode==='test')return;
 const open=referenceToggle.getAttribute('aria-expanded')!=='true';
 referenceToggle.setAttribute('aria-expanded',String(open));
 anchorBox.hidden=!open;
 document.getElementById('referenceChevron').textContent=open?'−':'＋';
});
restore();
for(const sec of APP_DATA.sections){if(!sessions[sec.id]){sessions[sec.id]=createSession();sessions[sec.id].items=poolFor(sec.id,'original');}}
render();
</script>
